<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Gradiente principal fondo: violeta → fucsia → naranja -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7C3AED"/>
      <stop offset="45%"  stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <!-- Gradiente del ícono blanco para darle profundidad -->
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Brillo superior -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Sombra interior (filtro) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente vibrante -->
  <rect width="48" height="48" rx="13" fill="url(#bg)"/>

  <!-- Brillo tipo glassmorphism en la mitad superior -->
  <rect width="48" height="26" rx="13" fill="url(#shine)"/>

  <!-- Etiqueta de precio (tag) — forma principal -->
  <path d="M10 15 L10 25 L22.5 37.5 Q24 39 25.5 37.5 L37.5 25.5 Q39 24 37.5 22.5 L25 10 L14 10 Q10 10 10 15 Z"
        fill="url(#icon)" filter="url(#shadow)" opacity="0.95"/>

  <!-- Círculo del ojal del tag -->
  <circle cx="16.5" cy="16.5" r="2.2" fill="#EC4899"/>

  <!-- Símbolo de dólar estilizado dentro del tag -->
  <text x="27" y="31"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        font-weight="900"
        fill="#7C3AED"
        text-anchor="middle"
        dominant-baseline="middle"
        opacity="0.9">$</text>
</svg>
